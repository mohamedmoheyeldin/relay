[package]
name = "relay-setup"
description = "Relay Setup: the small app that installs, updates, repairs or removes Relay."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "relay-setup"
path = "src/main.rs"

[features]
# Serve the static frontend from the binary (what `tauri build` turns on). On by
# default because relay-setup is built with plain `cargo build`, never `tauri dev`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }

# The app itself only exists on Windows. Elsewhere the crate builds its pure logic
# (version compare, what to offer) so `cargo test` runs on any OS without GUI libraries.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
