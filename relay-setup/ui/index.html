<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="relay.svg" />
    <title>Relay Setup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-name" data-tauri-drag-region>
        <img src="relay.svg" alt="" width="16" height="16" />
        <span data-tauri-drag-region>Relay Setup</span>
      </div>
      <div class="titlebar-buttons">
        <button class="tb" id="tb-min" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button class="tb tb-close" id="tb-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <template id="t-loading">
      <section class="screen center">
        <div class="spinner big" aria-hidden="true"></div>
        <p class="muted">Checking for Relay on this PC…</p>
      </section>
    </template>

    <template id="t-choose">
      <section class="screen">
        <div class="hero">
          <img class="logo" src="relay.svg" alt="" width="52" height="52" />
          <div>
            <h1 data-slot="title"></h1>
            <p class="muted" data-slot="subtitle"></p>
          </div>
        </div>
        <div class="card" data-slot="card"></div>
        <p class="notice" data-slot="notice" hidden></p>
        <footer class="actions">
          <button class="btn quiet" data-slot="secondary" hidden></button>
          <span class="spacer"></span>
          <button class="btn ghost" data-slot="tertiary" hidden></button>
          <button class="btn primary" data-slot="primary"></button>
        </footer>
      </section>
    </template>

    <template id="t-progress">
      <section class="screen">
        <div class="hero">
          <img class="logo" src="relay.svg" alt="" width="52" height="52" />
          <div>
            <h1 data-slot="title"></h1>
            <p class="muted" data-slot="subtitle"></p>
          </div>
        </div>
        <div class="card">
          <ol class="steps" data-slot="steps"></ol>
        </div>
        <div class="bar" role="progressbar" aria-label="Working"><span></span></div>
      </section>
    </template>

    <template id="t-done">
      <section class="screen center">
        <div class="badge" data-slot="badge"></div>
        <h1 data-slot="title"></h1>
        <p class="muted narrow" data-slot="subtitle"></p>
        <p class="code" data-slot="code" hidden></p>
        <footer class="actions centered">
          <button class="btn ghost" data-slot="secondary"></button>
          <button class="btn primary" data-slot="primary"></button>
        </footer>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
