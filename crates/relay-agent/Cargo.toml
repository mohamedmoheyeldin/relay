[package]
name = "relay-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
relay-ai = { path = "../relay-ai" }
relay-mcp = { path = "../relay-mcp" }
relay-protocol = { path = "../relay-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
relay-os = { path = "../relay-os", features = ["testing"] }

[lints]
workspace = true
