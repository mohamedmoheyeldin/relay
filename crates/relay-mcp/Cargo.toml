[package]
name = "relay-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
relay-os = { path = "../relay-os" }
relay-protocol = { path = "../relay-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
relay-os = { path = "../relay-os", features = ["testing"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints]
workspace = true
