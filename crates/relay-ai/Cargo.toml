[package]
name = "relay-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fake_cli"
path = "src/bin/fake_cli.rs"
test = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "rt", "fs"] }
tokio-util = "0.7"
tracing = "0.1"

[lints]
workspace = true

