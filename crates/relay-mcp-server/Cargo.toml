[package]
name = "relay-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Relay as a stand-alone MCP server (stdio) for Claude Code, Codex and other MCP clients"

[[bin]]
name = "relay-mcp"
path = "src/main.rs"

[lib]
name = "relay_mcp_server"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
relay-mcp = { path = "../relay-mcp" }
relay-orchestrator = { path = "../relay-orchestrator" }
relay-os = { path = "../relay-os" }
relay-protocol = { path = "../relay-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
relay-mcp-client = { path = "../relay-mcp-client" }
async-trait = "0.1"
relay-os = { path = "../relay-os", features = ["testing"] }

[lints]
workspace = true
