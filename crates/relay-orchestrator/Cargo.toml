[package]
name = "relay-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opener = "0.9"
relay-os = { path = "../relay-os" }
trash = "5"
walkdir = "2"
async-trait = "0.1"
relay-protocol = { path = "../relay-protocol" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
relay-os = { path = "../relay-os", features = ["testing"] }

[lints]
workspace = true
