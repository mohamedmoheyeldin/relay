[project]
name = "relay-screen"
version = "0.1.0.dev0"
description = "Relay's MCP server: computer-use toolset, UI Automation, OCR and local vision for Windows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastMCP API; v2 renamed it to MCPServer (see docs/decisions.md D-010)
    "mcp>=1.28,<2",
    "mss>=10",
    "pillow>=11",
    "uiautomation>=2.0.20 ; sys_platform == 'win32'",
]

[project.scripts]
relay-screen = "relay_screen.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_screen"]
