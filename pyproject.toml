[project]
name = "relay"
version = "0.1.0.dev0"
description = "Local-first AI desktop operator for Windows. Local hands, cloud brain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["relay-screen"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["relay-screen"]

[tool.uv.sources]
relay-screen = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["relay-screen/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "desktop: needs a real Windows desktop session (skipped in CI and on other OSes)",
]
addopts = "-m 'not desktop'"

[tool.pyright]
include = ["relay-screen/src", "relay-screen/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["relay_screen"]
