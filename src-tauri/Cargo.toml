[package]
name = "relay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Relay: an AI desktop operator"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
relay-agent = { path = "../crates/relay-agent" }
relay-ai = { path = "../crates/relay-ai" }
relay-mcp = { path = "../crates/relay-mcp" }
relay-os = { path = "../crates/relay-os" }
relay-protocol = { path = "../crates/relay-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
