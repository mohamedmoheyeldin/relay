<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Relay mark: a lowercase "r" drawn as two linked nodes.
       The solid node at the foot is the local hands; the open ring at the
       shoulder is the cloud brain; the stroke between them is the handoff. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0603E"/>
      <stop offset="1" stop-color="#B25535"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="116" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 742V478a140 140 0 0 1 140-140H512"/>
    <circle cx="652" cy="338" r="130" stroke-width="108"/>
  </g>
  <circle cx="312" cy="742" r="124" fill="#FFFFFF"/>
</svg>
