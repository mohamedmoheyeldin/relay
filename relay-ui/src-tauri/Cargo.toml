[package]
name = "relay-ui"
description = "Relay: the desktop app (tray, chat window, setup and settings)."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "relay"

[[bin]]
name = "relay"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "relay_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
portable-pty = "0.9"
relay-core = { path = "../../relay-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
